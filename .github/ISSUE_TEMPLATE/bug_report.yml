name: Bug report
description: Something in reservations, stock or alerts behaves incorrectly.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behavior, including any exception and its message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Calls made to InventoryService, in order (SKU, category, quantities, timing).
      placeholder: |
        1. registerProduct("SKU-1", FLASH_SALE)
        2. addStock("SKU-1", 10)
        3. reserve("ORDER-1", "SKU-1", 3)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Reservations, Expiration, Confirmation, Stock, Low stock alerts, Other]
    validations:
      required: true
